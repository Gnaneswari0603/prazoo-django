    {% extends 'jaibabu/base.html' %}
    {% load static %}

    {% block content %}

    <style>

    /* HERO SECTION */
    .contact-hero {
        position: relative;
        height: 60vh;
        background: url("{% static 'images/pexels-photo-268533.jpeg' %}") no-repeat center center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* GRADIENT OVERLAY */
    .contact-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6));
    }

    /* HERO TEXT */
    .contact-hero h1 {
        position: relative;
        font-size: 50px;
        z-index: 2;
    }

    /* SECTION BELOW */
    .contact-section {
        background: #f5f5f5;
        padding: 60px 80px;
    }

    /* TITLE */
    .contact-title {
        text-align: center;
        margin-bottom: 40px;
    }

    .contact-title h2 {
        font-size: 32px;
    }

    /* FLEX LAYOUT */
    .contact-container {
        display: flex;
        justify-content: space-between;
        gap: 40px;
    }

    /* LEFT SIDE */
    .contact-left {
        width: 45%;
    }

    .contact-left h3 {
        margin-bottom: 15px;
    }

    .contact-left p {
        color: #555;
        line-height: 1.6;
    }

    /* RIGHT FORM */
    .contact-form {
        width: 50%;
    }

    /* INPUTS */
    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    /* BUTTON */
    .contact-form button {
        background: #007bff;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .contact-form button:hover {
        background: #0056b3;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .contact-container {
            flex-direction: column;
        }

        .contact-left,
        .contact-form {
            width: 100%;
        }
    }

    </style>


    <!-- HERO -->
    <div class="contact-hero">
        <h1>Contact Us</h1>
    </div>


    <!-- CONTENT -->
    <div class="contact-section">

        <div class="contact-title">
            <h2>Let’s Start a Conversation</h2>
        </div>

        <div class="contact-container">

            <!-- LEFT -->
            <div class="contact-left">
                <h3>Ask how we can help you:</h3>
                <p>
                    See our platform in action. Request a demo or sign up for a free trial.
                    Learn how we help businesses grow with smart solutions.
                </p>
            </div>

            <!-- RIGHT FORM -->
            <div class="contact-form">
                <form method="POST" action="">
                {% csrf_token %}
            
                <input type="text" name="firstname" placeholder="First Name" required>
                <input type="text" name="lastname" placeholder="Last Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" rows="5" placeholder="Your Message"></textarea>

                <button type="submit">Submit</button>
            </form>
            </div>

        </div>

    </div>

    {% endblock %}
